<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Phone Screen Mockup -->
  <rect width="400" height="500" fill="#0f172a" rx="20" />
  
  <!-- Screen Area -->
  <rect x="10" y="10" width="380" height="480" fill="#f8fafc" rx="16" />
  
  <!-- App Header -->
  <rect x="10" y="10" width="380" height="60" fill="#ffffff" rx="16 16 0 0" />
  <line x1="10" y1="70" x2="390" y2="70" stroke="#e2e8f0" />
  <circle cx="45" cy="40" r="18" fill="#005f56" />
  <text x="45" y="45" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EPFO</text>
  <text x="75" y="38" fill="#0f172a" font-size="14" font-weight="bold">VK-EPFOHO</text>
  <text x="75" y="52" fill="#64748b" font-size="11">Official EPFO Alerts</text>

  <!-- Date Pill -->
  <rect x="160" y="90" width="80" height="20" fill="#e2e8f0" rx="10" />
  <text x="200" y="104" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">Yesterday</text>

  <!-- SMS Chat Bubble -->
  <rect x="25" y="125" width="350" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="12" />
  <text x="45" y="150" fill="#1e293b" font-size="12" font-weight="600">Dear Member (UAN 100928374821),</text>
  <text x="45" y="175" fill="#334155" font-size="12">Your Claim ID MHBAN260819 for PF</text>
  <text x="45" y="195" fill="#334155" font-size="12">Settlement has been returned.</text>
  <text x="45" y="225" fill="#dc2626" font-size="12" font-weight="bold">Reason: "Claim Returned - NEFT failed.</text>
  <text x="45" y="245" fill="#dc2626" font-size="12" font-weight="bold">Bank account details invalid or inactive."</text>
  <text x="45" y="270" fill="#64748b" font-size="11">Please update bank KYC on portal. - EPFO</text>
  <text x="340" y="275" fill="#94a3b8" font-size="10" text-anchor="end">16:42</text>

  <!-- Second Info Bubble -->
  <rect x="25" y="300" width="350" height="85" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="12" />
  <text x="45" y="325" fill="#166534" font-size="11" font-weight="bold">TIP FROM PF SAHI KARO:</text>
  <text x="45" y="345" fill="#15803d" font-size="11">Upload this screenshot to PF Sahi Karo</text>
  <text x="45" y="365" fill="#15803d" font-size="11">to get the exact IFSC &amp; cheque fix steps!</text>
</svg>